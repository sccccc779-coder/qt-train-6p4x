<script>
(function(){
  function systemDark(){ return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
  try{ localStorage.removeItem('qtrain-theme'); }catch(e){}   /* 清掉旧版残留的「永久记住」，否则会一直卡在旧选择 */
  var s=null; try{ s=sessionStorage.getItem('qtrain-theme'); }catch(e){}
  if(!s){ s = systemDark() ? 'dark' : 'light'; }
  document.documentElement.setAttribute('data-theme', s);
  /* 系统深浅色变化时实时同步（用户手动选过则以手动为准） */
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    var onSys = function(e){
      var cur = null; try{ cur = sessionStorage.getItem('qtrain-theme'); }catch(err){}
      if (cur !== 'dark' && cur !== 'light') { document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light'); }
    };
    if (mq.addEventListener) mq.addEventListener('change', onSys);
    else if (mq.addListener) mq.addListener(onSys);
  }
})();
</script>
<style>
:root{
  --bg:#f6f8fc; --panel:#ffffff; --panel-2:#f0f4fa; --ink:#101a2e; --body:#33415a;
  --muted:#6a7890; --line:#e3e9f2; --accent:#2f6bff; --accent-soft:#e9f0ff;
  --red:#c62839; --red-soft:#fdecee; --green:#0d7a53; --green-soft:#e6f6ef;
  --shadow:0 1px 2px rgba(16,26,46,.05),0 10px 28px -14px rgba(16,26,46,.22);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#0b111c; --panel:#121a28; --panel-2:#182233; --ink:#eaf0f8; --body:#c2cdde;
  --muted:#8595ad; --line:#243247; --accent:#7aa2ff; --accent-soft:#17253f;
  --red:#ff7b88; --red-soft:#2b1619; --green:#4ecfa0; --green-soft:#102a23;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}
.wrap{max-width:520px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:34px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:0 0 34px}
.bname{font-weight:700;color:var(--ink);font-size:16px;line-height:1.3}
.bsub{font-size:12.5px;color:var(--muted)}
h1{color:var(--ink);font-size:22px;margin:0 0 6px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
label{display:block;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:7px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:15px;letter-spacing:.06em;padding:11px 13px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);outline:none}
input:focus{border-color:var(--accent);background:var(--panel)}
button{font:inherit;font-size:15px;font-weight:600;padding:11px 20px;border-radius:10px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.6;cursor:default;filter:none}
.btn-ghost{background:transparent;color:var(--body);border-color:var(--line);font-size:13px;padding:9px 13px}
.msg{margin-top:14px;font-size:13.5px;min-height:20px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.msg.busy{color:var(--muted)}
.shake{animation:sh .3s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tips{margin-top:24px;font-size:12.5px;color:var(--muted);line-height:1.9;
  border-top:1px solid var(--line);padding-top:16px}
.tips b{color:var(--body);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--body);text-decoration:none}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.tgl{position:fixed;top:16px;right:16px;font:inherit;font-size:13px;cursor:pointer;padding:6px 12px;
  border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--body)}
.tgl:hover{border-color:var(--accent);color:var(--accent)}
.tgl-left{left:16px;right:auto;display:inline-block;text-decoration:none}
@media (max-width:520px){.card{padding:26px 20px}.row{flex-direction:column}}
@media print{body{background:#fff}.card{box-shadow:none}}
</style>

<script>
(function(){
  var b=document.getElementById('themeBtn'), KEY='qtrain-theme';
  function sync(){ b.textContent = document.documentElement.getAttribute('data-theme')==='dark' ? '☀️ 浅色' : '🌙 深色'; }
  sync();
  b.addEventListener('click', function(){
    var d=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme', d?'light':'dark');
    try{ sessionStorage.setItem(KEY, d?'light':'dark'); }catch(e){}
    sync();
  });
})();
</script>

var STORE = 'qtrain-pass';

var $ = function(id){ return document.getElementById(id); };
function b64(s){
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function setMsg(t, cls){
  var m=$('msg'); m.textContent=t||''; m.className='msg'+(cls?' '+cls:'');
}
function pick(){
  var c=(new URLSearchParams(location.search).get('c')||'').toLowerCase();
  if(ENC.items[c]) return c;
  var ks=Object.keys(ENC.items);
  return ks.length===1 ? ks[0] : null;
}
function chips(cur){
  var box=$('chips'); if(!box) return;
  Object.keys(ENC.items).forEach(function(k){
    var a=document.createElement('a');
    a.className='chip'+(k===cur?' on':''); a.textContent=ENC.items[k].title;
    a.href='gate.html?c='+k;
    box.appendChild(a);
  });
}

async function deriveBits(pass, salt){
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:salt, iterations:ENC.iter, hash:'SHA-256'}, km, 256));
}

// v2：内容主密钥被逐个准入码封装。并行试所有封装，命中即返回 —— 任一码都能解锁。
async function unwrapMaster(pass){
  var jobs = ENC.wraps.map(function(w, i){
    return (async function(){
      try{
        var bits = await deriveBits(pass, b64(w.salt));
        var k = await crypto.subtle.importKey('raw', bits, {name:'AES-GCM'}, false, ['decrypt']);
        var aad = new TextEncoder().encode(JSON.stringify({v:2, wrap:i}));
        var m = await crypto.subtle.decrypt(
          {name:'AES-GCM', iv:b64(w.iv), additionalData:aad, tagLength:128}, k, b64(w.ct));
        return new Uint8Array(m);
      }catch(e){ return null; }
    })();
  });
  var res = await Promise.all(jobs);
  for (var i=0;i<res.length;i++) if(res[i]) return {key:res[i], idx:i};
  return null;
}

var LOCK_BTN =
  '<button id="__lock" type="button" title="清除本机准入状态">🔒 锁定</button>' +
  '<style>#__lock{position:fixed;right:14px;bottom:14px;z-index:9999;font:inherit;font-size:12.5px;' +
  'cursor:pointer;padding:7px 13px;border-radius:999px;border:1px solid #d7dfea;background:#fff;' +
  'color:#5a6b85;box-shadow:0 2px 10px rgba(16,26,46,.18);opacity:.82}' +
  '#__lock:hover{opacity:1;color:#2f6bff;border-color:#2f6bff}' +
  '@media print{#__lock{display:none}}</style>' +
  '<scr'+'ipt>(function(){var b=document.getElementById("__lock");' +
  'if(b)b.addEventListener("click",function(){try{sessionStorage.removeItem("qtrain-pass")}catch(e){}' +
  'location.href="index.html";});})();</scr'+'ipt>';

function mount(html){
  var i = html.lastIndexOf('</body>');
  if (i > 0) html = html.slice(0,i) + LOCK_BTN + html.slice(i);
  else html += LOCK_BTN;
  document.open();
  document.write(html);
  document.close();
}

async function unlock(pass, slug){
  var it = ENC.items[slug];
  if(!it) throw new Error('课件不存在');
  setMsg('正在解密…（首次约需 1–2 秒）','busy');
  var got = await unwrapMaster(pass);
  if(!got) throw new Error('准入码不正确');
  var key = await crypto.subtle.importKey('raw', got.key, {name:'AES-GCM'}, false, ['decrypt']);
  var aad = new TextEncoder().encode(JSON.stringify({v:2, slug:slug}));
  var buf = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv:b64(it.iv), additionalData:aad, tagLength:128},
    key, b64(it.ct));
  return new TextDecoder().decode(buf);
}

function norm(p){ return String(p||'').replace(/[\s-]/g,'').toUpperCase(); }

async function run(pass){
  pass = norm(pass);
  if(!pass){ setMsg('请输入准入码','err'); $('pw').focus(); return; }
  var slug = pick();
  if(!slug){ setMsg('请在下方选择要打开的课件','busy'); return; }
  $('go').disabled = true;
  try{
    var html = await unlock(pass, slug);
    try{ sessionStorage.setItem(STORE, pass); }catch(e){}
    mount(html);
  }catch(err){
    $('go').disabled = false;
    try{ sessionStorage.removeItem(STORE); }catch(e){}
    $('card').classList.remove('shake');
    void $('card').offsetWidth;
    $('card').classList.add('shake');
    setMsg('准入码不正确或已失效。请向管理员重新索取（注意区分大小写）。','err');
    $('pw').select();
  }
}

document.addEventListener('DOMContentLoaded', function(){
  // 已解锁并整页替换后，网关 UI 不再存在，直接退出
  if(!$('pw')) return;
  var slug = pick();
  if(slug && ENC.items[slug]){
    $('ttl').textContent = ENC.items[slug].title;
    $('desc').textContent = ENC.items[slug].desc || '本页内容已加密，输入准入码解锁。';
  }
  chips(slug);
  $('go').addEventListener('click', function(){ run($('pw').value.trim()); });
  $('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') run($('pw').value.trim()); });
  $('pw').focus();

  var saved = null;
  try{ saved = sessionStorage.getItem(STORE); }catch(e){}
  if(saved){
    setMsg('检测到本机已解锁，正在恢复…','busy');
    run(saved);
  }
});
</script>
